site_name: Sous — Meal & Nutrition Concierge
site_description: A multi-agent meal & nutrition concierge built on Google's ADK.
repo_url: https://github.com/jth1911/jth-genai-L200

theme:
  name: material
  palette:
    - scheme: default
      primary: green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - content.code.copy

nav:
  - Home: index.md
  - Architecture: architecture.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
