name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Ruff (lint)
        run: uv run ruff check src tests

      - name: Unit tests (no LLM)
        run: uv run pytest -m "not llm" -q

  eval:
    name: ADK eval (live LLM)
    runs-on: ubuntu-latest
    needs: test
    # Only runs when a Gemini key is configured as a repo secret. PRs from forks
    # don't get secrets, so this is skipped there — unit tests still gate merges.
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run evals
        env:
          GOOGLE_GENAI_USE_VERTEXAI: "FALSE"
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "GOOGLE_API_KEY secret not set — skipping live evals."
            exit 0
          fi
          uv run pytest -m llm -q
